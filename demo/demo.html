<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distorted Form</title>
    <!-- External stylesheet link to satisfy Content Security Policy -->
    <link rel="stylesheet" href="./distorted-demo.css">
</head>
<body>

<form>
  <label>
    Mobile number
    <input type="tel" name="mobileNumber">
  </label>

  <label>
    PAN number
    <input type="text" name="panNumber">
  </label>

  <label>
    Full name
    <input type="text" name="fullName">
  </label>

  <label>
    Residential address
    <textarea name="address"></textarea>
  </label>

  <label>
    Email address
    <input type="email" name="email">
  </label>

  <label>
    Aadhaar number
    <input type="text" name="aadhaarNumber">
  </label>

  <label>
    Date of birth
    <input type="date" name="dateOfBirth">
  </label>
</form>

</body>
</html>
